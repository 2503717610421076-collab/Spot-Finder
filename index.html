
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOTS | Coimbatore's Best Verified Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            background-color: #fcfaf7;
            background-image: radial-gradient(#e2e8f0 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Animated underline for navigation */
        .nav-link {
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #f26522;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }

        /* Initial Entry Animations */
        @keyframes splashPin {
            0% { transform: scale(0) translateY(20px); opacity: 0; }
            50% { transform: scale(1.2) translateY(-10px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes shimmerText {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes contentEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
        }

        @keyframes headerTitleSpread {
            0% { letter-spacing: -0.05em; opacity: 0; filter: blur(5px); }
            100% { letter-spacing: -0.02em; opacity: 1; filter: blur(0px); }
        }

        .animate-splash-pin {
            animation: splashPin 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .shimmer-text {
            background: linear-gradient(90deg, #94a3b8 0%, #ffffff 50%, #94a3b8 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 3s linear infinite;
        }

        .animate-entrance {
            animation: contentEntrance 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .animate-title-entrance {
            animation: headerTitleSpread 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Modal Transitions */
        @keyframes revealUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-reveal {
            animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        @keyframes modalOverlayIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(12px); }
        }

        @keyframes modalOverlayOut {
            from { opacity: 1; backdrop-filter: blur(12px); }
            to { opacity: 0; backdrop-filter: blur(0px); }
        }

        @keyframes modalZoomIn {
            from { opacity: 0; transform: scale(0.92) translateY(60px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
        }

        @keyframes modalZoomOut {
            from { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
            to { opacity: 0; transform: scale(0.95) translateY(40px); filter: blur(4px); }
        }

        .animate-modal-overlay {
            animation: modalOverlayIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-modal-overlay-exit {
            animation: modalOverlayOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-modal-content {
            animation: modalZoomIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .animate-modal-content-exit {
            animation: modalZoomOut 0.4s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }
    </style>

</head>

</body>
</html>
